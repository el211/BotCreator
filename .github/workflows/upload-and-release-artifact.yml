name: Upload And Release Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  upload_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: BotCreator-Desktop
          archive: false
          path: bot-creator-main/target/BotCreator*.jar
      - name: Upload Paper artifact
        uses: actions/upload-artifact@v7
        with:
          name: BotCreator-Paper
          archive: false
          path: bot-creator-paper/target/BotCreator-Paper*.jar
      - name: Run release-please
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: maven
      - name: Upload Release Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.release_created
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} bot-creator-main/target/BotCreator*.jar bot-creator-paper/target/BotCreator-Paper*.jar
